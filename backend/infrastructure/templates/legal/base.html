<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Laia{% endblock %} · Laia</title>
<style>
  :root { --bg:#F6F7FB; --card:#FFFFFF; --ink:#141A2E; --muted:#4B5574; --brand:#4338CA; --accent:#F25C2A; --line:#E2E5EF; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0B1020; --card:#131A2E; --ink:#EEF0F8; --muted:#A9B1CC; --brand:#A5B4FC; --accent:#FF8A5C; --line:#232C47; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.65 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px max(16px, env(safe-area-inset-left)); }
  main { max-width: 760px; margin: 0 auto; background: var(--card); border:1px solid var(--line); border-radius: 20px; padding: 28px clamp(18px, 4vw, 44px); }
  .brand { font-weight: 800; font-size: 28px; letter-spacing:-0.02em; margin:0 0 4px; }
  .brand span { color: var(--accent); }
  h1 { font-size: 26px; line-height:1.25; margin: 8px 0 4px; }
  h2 { font-size: 19px; margin: 28px 0 6px; color: var(--brand); }
  p, li { color: var(--ink); }
  .meta { color: var(--muted); font-size: 14px; margin-bottom: 18px; }
  table { width:100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align:left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  .box { border-left: 4px solid var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); padding: 12px 16px; border-radius: 8px; }
  nav { margin-top: 28px; font-size: 14px; display:flex; gap: 16px; flex-wrap: wrap; }
  a { color: var(--brand); }
</style>
</head>
<body>
<main>
  <p class="brand">Lai<span>a</span></p>
  {% block content %}{% endblock %}
  <nav>
    <a href="/legal/privacidad/">Privacidad</a>
    <a href="/legal/terminos/">Condiciones</a>
    <a href="/legal/negocios/">Para negocios</a>
  </nav>
</main>
</body>
</html>
