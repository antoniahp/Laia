[project]
name = "laia-backend"
version = "2.0.0"
description = "Laia: dile qué quieres y ella llama al negocio por ti. Django Ninja + arquitectura hexagonal con CQRS."
requires-python = ">=3.12,<3.13"
dependencies = [
    "django (>=5.2,<6.0)",
    "django-ninja (>=1.3,<2.0)",
    "dj-database-url (>=3.0,<4.0)",
    "psycopg[binary] (>=3.2,<4.0)",
    "whitenoise (>=6.7,<7.0)",
    "python-dotenv (>=1.0,<2.0)",
    "httpx (>=0.27)",
    "pyjwt (>=2.9,<3.0)",
    "phonenumbers (>=8.13)",
    "twilio (>=9.0,<10.0)",
    "uvicorn[standard] (>=0.30)",
    "starlette (>=0.40)",
    "fastapi (>=0.110)",
    "pipecat-ai[silero,whisper,elevenlabs,ollama] (>=1.13,<2.0)",
    "mlx-whisper (>=0.4.3,<0.5.0) ; sys_platform == \"darwin\" and platform_machine == \"arm64\"",
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3"
pytest-django = ">=4.9"
pytest-asyncio = ">=0.24"
ruff = ">=0.6"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "core.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
filterwarnings = ["ignore:No directory at:UserWarning", "ignore::DeprecationWarning"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 140
target-version = "py312"
extend-exclude = ["domain/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B904"]

[tool.ruff.lint.isort]
known-first-party = ["core", "domain", "application", "infrastructure", "tests"]
